name: Keep Supabase awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Real query to Supabase database
        run: |
          echo "Pinging Supabase database..."
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")
          
          echo "HTTP Response Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Success: Supabase is awake"
          elif [ "$HTTP_CODE" -eq 401 ] || [ "$HTTP_CODE" -eq 403 ]; then
            echo "❌ Auth error: Check your SUPABASE_ANON_KEY secret"
            exit 1
          elif [ "$HTTP_CODE" -eq 404 ]; then
            echo "❌ Table not found: Create a 'keepalive' table in Supabase"
            exit 1
          else
            echo "⚠️ Unexpected response: $HTTP_CODE"
            exit 1
          fi