name: Keep Supabase awake

on:
  schedule:
    - cron: '0 */6 * * *'  # cada 6 horas (más seguro)
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Real query to Supabase database
        run: |
          echo "Pinging Supabase database with real query..."
          RESPONSE=$(curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/?select=1&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP_CODE:%{http_code}" 2>&1)
          echo "Response: $RESPONSE"
          
          # Also ping the auth service
          curl -sf "${{ secrets.SUPABASE_URL }}/auth/v1/settings" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
